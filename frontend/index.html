<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yen Gov — For an informed India</title>
    <!--
      Deploy base. Vite rewrites the `content` to the configured `base`
      (e.g. `/yen-gov/`) at build time. The 404.html SPA shim reads this
      to know where to bounce unknown paths back to.
    -->
    <meta name="yg-base" content="%BASE_URL%" />
    <!--
      Self-hosted variable fonts (plan section 21.7 / 23.5; U1.2 of
      TODO/20260604-u1-tokens-fonts-subplan.md). The Google-CDN
      <link>+<preconnect> pair that used to load Outfit here was
      REMOVED in U1.2 to avoid double-loading once the @font-face
      declarations in src/app.css point at /fonts/*.woff2.

      Preload ONLY Inter-Latin: it is the body / UI font and the only
      one needed on first paint of every route. Devanagari is fetched
      on demand by unicode-range only when a Devanagari codepoint
      actually renders (state names like "अरुणाचल" trigger it). Outfit
      is loaded by the LeftRail wordmark via the @font-face rule (no
      preload because it is one component, not the page body).
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin.woff2"
      crossorigin
    />
    <!--
      SPA boot shim. The 404.html stashes the requested path in
      sessionStorage and bounces to `/`. Here we pop it back and rewrite
      the URL via history.replaceState BEFORE the SPA initialises, so the
      router sees the real path on first render.
    -->
    <script>
      (function () {
        try {
          var saved = sessionStorage.getItem("yg:redirect");
          if (!saved) return;
          sessionStorage.removeItem("yg:redirect");
          var meta = document.querySelector('meta[name="yg-base"]');
          var base = meta ? meta.getAttribute("content") : "/";
          if (!base.endsWith("/")) base += "/";
          // saved starts with "/" (path relative to host root within the
          // deploy base). Compose with base, collapsing duplicate slashes.
          var target = base.replace(/\/$/, "") + saved;
          if (target !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", target);
          }
        } catch (_e) {
          // Non-fatal — the SPA will land on `/` and the user can renavigate.
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
