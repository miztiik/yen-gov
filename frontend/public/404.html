<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yen Gov — redirecting…</title>
    <!--
      GitHub Pages SPA shim.

      GitHub Pages is a static host: it has no concept of SPA history routes,
      so a request to /tamil-nadu/elections/assembly-2026 would normally 404. Pages
      *does* serve this 404.html for any unknown path, so we use it to
      capture the requested path and bounce to the deploy base. The matching
      boot script in index.html restores the path before the SPA router runs.

      Inspired by rafgraph/spa-github-pages. sessionStorage is the clean path;
      a query-param fallback keeps direct links working when storage is
      blocked by a browser privacy setting.
    -->
    <script>
      (function () {
        var base = "%BASE_URL%";
        if (!base || base.charAt(0) === "%") base = "/";
        if (!base.endsWith("/")) base += "/";
        try {
          // Vite's template404Plugin substitutes %BASE_URL% at build time
          // (e.g. "/yen-gov/" on project Pages, "/" on root deploys). At
          // dev time this file is never served (vite middleware handles
          // missing routes), so the unsubstituted placeholder is harmless.
          var path = location.pathname;
          var rel = path;
          if (path.indexOf(base) === 0) rel = path.slice(base.length - 1);
          var saved = rel + location.search + location.hash;
          try {
            sessionStorage.setItem("yg:redirect", saved);
            location.replace(base);
            return;
          } catch (_storage) {
            location.replace(base + "?yg-redirect=" + encodeURIComponent(saved));
            return;
          }
          location.replace(base);
        } catch (e) {
          location.replace(base);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the app…</p>
  </body>
</html>
